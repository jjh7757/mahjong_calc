# 앱 CI: push·PR 마다 analyze + test. master push 엔 APK 도 빌드해 artifact 로 올린다.
# APK 의 서버 키는 저장소 Secrets 의 RECOGNIZER_API_KEY (없으면 APK 단계는 건너뜀).
# 서명 키는 Secrets 의 DEBUG_KEYSTORE_B64 (노트북 debug.keystore, 없으면 APK 빌드 실패).
name: ci

on:
  push:
    branches: [master]
    paths-ignore:            # 문서·실험 메모만 바뀌면 안 돌린다(APK 빌드 10분 절약)
      - "**.md"
      - "docs/**"
      - "experiments/**"
      - "screenshots/**"
      - "community/**"
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"   # 로컬과 같은 버전(.dart_tool/package_config.json)

concurrency:                  # 같은 브랜치에 새 push 가 오면 돌던 실행은 취소
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 키 확인
        id: key
        env:
          KEY: ${{ secrets.RECOGNIZER_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "RECOGNIZER_API_KEY secret 이 없어 APK 를 건너뜀 (gh secret set --env-file <RECOGNIZER_API_KEY=... 가 든 dotenv 파일>)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.present == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4   # ~/.gradle 캐시(의존성·래퍼) — 두 번째 빌드부터 빨라진다
        if: steps.key.outputs.present == 'true'
        with:
          cache-read-only: false
      # release 도 debug 키로 서명한다(build.gradle.kts). 노트북 빌드와 같은 키여야 설치된 앱에 덮어 설치된다.
      # 없으면 러너가 임시 키를 만들어 덮어 설치가 안 되는 APK 가 나오므로 실패시킨다.
      - name: 서명 키 복원
        if: steps.key.outputs.present == 'true'
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret 이 없음 (노트북 ~/.android/debug.keystore 의 base64)"
            exit 1
          fi
          # 러너에선 ~/.android 를 안 읽는다(첫 시도에서 키가 실행마다 새로 생김). 위치를 못 박는다.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: APK 빌드 (release, 운영 키)
        if: steps.key.outputs.present == 'true'
        run: flutter build apk --release --dart-define=RECOGNIZER_API_KEY=${{ secrets.RECOGNIZER_API_KEY }}
      # 노트북 키의 인증서 지문(공개 값). 다르면 덮어 설치가 안 되므로 APK 를 올리지 않는다.
      - name: 서명 지문 확인
        if: steps.key.outputs.present == 'true'
        env:
          EXPECTED_SHA256: cf9eceef7e295a5c5d2b24a269547cf4f053f04b946f3cb29600adde68433b79
        run: |
          find "$HOME" -name debug.keystore -not -path '*/.pub-cache/*' 2>/dev/null
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          echo "서명 지문: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK 서명 지문이 노트북 키와 다름 (기대 $EXPECTED_SHA256)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: mahjong_calc-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
